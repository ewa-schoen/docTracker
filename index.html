<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doc Tracker</title>
<meta name="description" content="Track documents and their expiry dates, with reminders before they run out.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F0F2F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1424" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  color-scheme: light dark;
  --bg:#F0F2F8;
  --surface:#FFFFFF;
  --ink:#1A2033;
  --muted:#5B6580;
  --line:#DADFEC;
  --ring:#8C97B5;
  --ok:#0A7360;
  --ok-bg:#E1F2EE;
  --warn:#8F5200;
  --warn-bar:#E39A12;
  --warn-bg:#FFF1D6;
  --bad:#B42A22;
  --bad-bg:#FBE4E1;
  --info:#2B55C9;
  --info-bg:#E4EBFC;
  --link:#3550D6;
  --toast-action:#8FA6FF;
  --kid:#3550D6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1424;
    --surface:#171E33;
    --ink:#E8ECF7;
    --muted:#98A3C0;
    --line:#293250;
    --ring:#65719A;
    --ok:#3CCBA8;
    --ok-bg:#123229;
    --warn:#F2C065;
    --warn-bar:#F2C065;
    --warn-bg:#3A2D10;
    --bad:#FF8A80;
    --bad-bg:#3C1B19;
    --info:#8FB0FF;
    --info-bg:#1B2A55;
    --link:#8EA2FF;
    --toast-action:#3550D6;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
[hidden]{display:none !important}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}

.wrap{
  max-width:560px;margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(130px + env(safe-area-inset-bottom,0px));
}

/* header */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.when{color:var(--muted);font-size:15px;font-weight:600}
h1{margin:6px 0 0;font-size:clamp(32px,10vw,40px);line-height:1.05;font-weight:800;letter-spacing:-.03em}
.tools{display:flex;gap:4px;flex:none}
.iconbtn{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);display:grid;place-items:center;padding:0;flex:none;
}
.iconbtn svg{width:22px;height:22px}
.linkbtn{background:none;border:0;padding:4px 0;min-height:32px;font-size:14px;font-weight:700;color:var(--link)}

/* summary */
.card{
  position:relative;overflow:hidden;margin-top:16px;padding:16px;background:var(--surface);
  border:1px solid var(--line);border-radius:22px;
}
.card h2{margin:0;font-size:20px;line-height:1.25;font-weight:750;letter-spacing:-.01em}
.card h2.attn{color:var(--warn)}
.card h2.good{color:var(--ok)}
.card .note{margin:4px 0 0;color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tile{
  display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:10px 12px;border-radius:16px;
  background:var(--bg);border:1.5px solid transparent;text-align:left;
}
.tile b{font-size:26px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;font-weight:650;color:var(--muted)}
.tile.t-expired b{color:var(--bad)}
.tile.t-soon b{color:var(--warn)}
.tile.t-ok b{color:var(--ok)}
.tile[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}

/* controls */
.search{
  width:100%;height:46px;margin-top:14px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-size:16px;
}
.kids{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:4px 16px 8px;scrollbar-width:none}
.kids::-webkit-scrollbar{display:none}
.kidchip{
  position:relative;flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 5px;
  border-radius:22px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;
}
.kidchip .avatar{width:34px;height:34px;font-size:15px}
.kidchip[aria-selected="true"]{background:var(--kid);border-color:var(--kid);color:#fff}
.kidchip[aria-selected="true"] .avatar{background:#fff;color:var(--kid)}
.kidchip.allchip{padding:0 16px}
.kidchip.allchip[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.kidchip .duedot{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:var(--warn-bar);border:2px solid var(--bg)}
.avatar{
  width:48px;height:48px;border-radius:50%;background:var(--kid);color:#fff;flex:none;
  display:grid;place-items:center;font-weight:800;font-size:20px;
}
.groupby{display:flex;align-items:center;gap:10px;margin-top:6px}
.groupby > span{font-size:13px;font-weight:700;color:var(--muted);flex:none}
.groupby .seg3{margin:0;flex:1}
.groupby .seg3 span{min-height:38px;font-size:14px}

/* document list */
.grouphead{margin:22px 4px 8px;font-size:14px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.grouphead.g-expired{color:var(--bad)}
.grouphead.g-soon{color:var(--warn)}
.group{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{border-top:1px solid var(--line);box-shadow:inset 5px 0 0 var(--sc,var(--ring))}
.row:first-child{border-top:0}
.st-expired{--sc:var(--bad)}
.st-soon{--sc:var(--warn-bar)}
.st-progress{--sc:var(--info)}
.st-ok{--sc:var(--ok)}
.st-none{--sc:var(--ring)}
.rowbtn{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;
  min-height:72px;padding:12px 16px 12px 20px;background:none;border:0;text-align:left;
}
.name{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;margin-top:2px}
.tag{font-size:13px;color:var(--muted)}
.owner{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink)}
.owner i{width:10px;height:10px;border-radius:50%;background:var(--kid);display:inline-block}
.side{text-align:right;white-space:nowrap}
.rel{font-weight:800;font-size:15px}
.st-expired .rel{color:var(--bad)}
.st-soon .rel{color:var(--warn)}
.st-progress .rel{color:var(--info)}
.st-ok .rel{color:var(--ok)}
.st-none .rel{color:var(--muted)}
.dt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{display:inline-block;margin-top:2px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--info-bg);color:var(--info)}

.empty{text-align:center;padding:36px 12px 8px}
.empty h2{margin:0 0 6px;font-size:22px;font-weight:750}
.empty p{margin:0 auto 18px;max-width:34ch;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{min-height:44px;padding:0 16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);font-weight:650}
.archived{margin-top:26px}

.add{
  position:fixed;left:0;right:0;margin:0 auto;width:max-content;
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  height:56px;padding:0 24px 0 18px;border:0;border-radius:28px;white-space:nowrap;
  display:flex;align-items:center;gap:8px;font-weight:750;
  background:var(--ink);color:var(--bg);box-shadow:0 8px 22px rgba(10,16,36,.28);z-index:10;
}
.add svg{width:22px;height:22px}

/* sheets */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(9,13,28,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);
  border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));
  animation:up .2s ease-out;
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font-size:21px;font-weight:750;letter-spacing:-.01em;overflow-wrap:anywhere}
.sheet .sub2{margin:0 0 14px;color:var(--muted);font-size:15px}
.field{display:block;margin-bottom:14px}
.lbl{display:block;font-size:14px;font-weight:650;margin-bottom:6px}
.lbl .opt{color:var(--muted);font-weight:500}
.hint{margin:0 0 10px;color:var(--muted);font-size:13px}
input[type=text],input[type=number],input[type=date],input[type=url]{
  width:100%;height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);font:inherit;font-size:16px;
}
textarea{
  width:100%;min-height:76px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);font:inherit;font-size:16px;resize:vertical;
}
input:focus,textarea:focus{border-color:var(--link)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.seg3.two{grid-template-columns:1fr 1fr}
.seg3 label{position:relative;display:block}
.seg3 input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg3 span{
  display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 6px;
  border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:650;font-size:15px;text-align:center;
}
.seg3 input:checked+span{border-color:transparent;background:var(--ink);color:var(--bg)}
.seg3 input:focus-visible+span,.pickchip input:focus-visible+span{outline:3px solid var(--link);outline-offset:2px}
.pickchips{display:flex;flex-wrap:wrap;gap:8px}
.pickchip{position:relative;display:block}
.pickchip input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.pickchip span{
  display:flex;align-items:center;min-height:44px;padding:0 15px;border-radius:22px;
  border:1.5px solid var(--line);background:var(--bg);font-weight:650;font-size:15px;
}
.pickchip input:checked+span{background:var(--ink);color:var(--bg);border-color:transparent}
.customrow{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:start;margin-top:12px}
.customrow .seg3{margin:0}
.customrow .seg3 span{min-height:48px;font-size:13px}
.customrow .btn{width:auto;padding:0 16px}
.tplrow{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 14px;padding:2px 20px 6px;scrollbar-width:none}
.tplrow::-webkit-scrollbar{display:none}
.tplrow .chip{flex:none;min-height:40px;padding:0 14px;font-size:14px;background:var(--bg)}

.switchrow{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:8px 0}
.switchrow b{font-weight:650}
.switchrow small{display:block;color:var(--muted);font-size:13px}
input.switch{
  -webkit-appearance:none;appearance:none;flex:none;position:relative;margin:0;
  width:52px;height:32px;border-radius:16px;border:0;background:var(--ring);transition:background .15s;
}
input.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
  background:#fff;transition:transform .15s;
}
input.switch:checked{background:var(--link)}
input.switch:checked::after{transform:translateX(20px)}
details{margin:2px 0 14px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px}
summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
details[open] summary{margin-bottom:4px}
.btnrow{display:grid;gap:10px}
.btn{
  min-height:50px;width:100%;padding:0 18px;border-radius:14px;border:0;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.btn small{font-size:13px;font-weight:500;opacity:.85}
.btn.primary{background:var(--link);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.extras{margin-top:14px;padding-top:6px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch}
.textbtn{background:none;border:0;min-height:46px;padding:8px 4px;text-align:left;font-weight:650}
.textbtn.dangertext{color:var(--bad)}
.section{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.section h3{margin:0 0 10px;font-size:15px;font-weight:700}
.section p{margin:0 0 12px;color:var(--muted);font-size:14px}
.notice{padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:14px;font-weight:600}
.notice b{display:block;margin-bottom:2px}
.vis{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* detail sheet */
.pillst{display:inline-block;margin:0 0 12px;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:800}
.pillst.st-expired{background:var(--bad-bg);color:var(--bad)}
.pillst.st-soon{background:var(--warn-bg);color:var(--warn)}
.pillst.st-progress{background:var(--info-bg);color:var(--info)}
.pillst.st-ok{background:var(--ok-bg);color:var(--ok)}
.pillst.st-none{background:var(--bg);color:var(--muted)}
.kv{margin:0 0 6px}
.kv div{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.kv div:first-child{border-top:0}
.kv dt{font-size:13px;font-weight:700;color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.kv a{color:var(--link);font-weight:650}
.rlist{list-style:none;margin:0 0 6px;padding:0}
.rlist li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.rlist li:first-child{border-top:0}
.rlist .past{color:var(--muted)}
.rlist .past b{color:var(--ok)}
.detailbtns{margin-top:14px}

.toast{
  position:fixed;left:0;right:0;margin:0 auto;width:max-content;z-index:30;
  bottom:calc(88px + env(safe-area-inset-bottom,0px));
  max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px;
  padding:12px 14px 12px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:15px;
  box-shadow:0 8px 22px rgba(10,16,36,.3);
}
.toast button{background:none;border:0;padding:6px 4px;min-height:36px;font-weight:800;color:var(--toast-action)}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bar">
      <div class="when" id="dateText"></div>
      <div class="tools">
        <button class="iconbtn" id="calBtn" type="button"></button>
        <button class="iconbtn" id="settingsBtn" type="button"></button>
      </div>
    </div>
    <h1 id="title"></h1>
  </header>
  <section id="summary" aria-live="polite"></section>
  <section id="controls"></section>
  <main id="list"></main>
  <section class="archived" id="archived"></section>
</div>
<button class="add" id="addBtn" type="button"></button>
<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

        'DTSTART;VALUE=DATE:' + icsDate(date), 'DTEND;VALUE=DATE:' + icsDate(shiftDay(date, 1)),
        'SUMMARY:' + icsEscape(summary), 'DESCRIPTION:' + icsEscape(desc), 'TRANSP:TRANSPARENT',
        'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEscape(summary), 'TRIGGER:PT9H', 'END:VALARM', 'END:VEVENT');
    };
    docs.forEach(function (d) {
      if (!d.expiry || d.archived) return;
      var who = d.owner ? ' (' + d.owner + ')' : '', name = d.title + who;
      var info = [d.number ? t('lNumber') + ': ' + d.number : '', d.location ? t('lLocation') + ': ' + d.location : '', d.url ? d.url : '', d.notes].filter(Boolean).join('\n');
      d.leads.forEach(function (l) {
        var date = leadDate(d.expiry, l);
        if (date >= live && date <= d.expiry) event(d.id + '-' + l, date, t('icsRenew') + ': ' + name + ', ' + t('icsValidUntil') + ' ' + fmtDate(d.expiry), info);
      });
      if (d.expiry >= live) event(d.id + '-exp', d.expiry, t('icsExpires') + ': ' + name, info);
    });
    lines.push('END:VCALENDAR');
    return { text: lines.map(icsFold).join('\r\n') + '\r\n', count: count };
  }
  function deliverFile(name, mime, text) {
    var download = function () {
      var url = URL.createObjectURL(new Blob([text], { type: mime }));
      var a = h('a', { href: url, download: name });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
    };
    var file = null;
    try { file = new File([text], name, { type: mime }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).catch(function (err) { if (!err || err.name !== 'AbortError') download(); });
    } else download();
  }
  function exportCalendar(docs) {
    var r = buildIcs(docs);
    if (!r.count) { toast(t('tNoDates')); return; }
    deliverFile('documents.ics', 'text/calendar', r.text);
    toast(t('tCal'));
  }

  /* ---------- background reminders (best effort) ---------- */
  // The page keeps a copy of the reminder schedule in IndexedDB; the service worker reads it when Chrome wakes it up.
  function idbOpen() {
    return new Promise(function (resolve, reject) {
      var r = indexedDB.open('docTracker', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
      r.onsuccess = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
    });
  }
  function idbGet(key) {
    return idbOpen().then(function (db) { return new Promise(function (resolve, reject) { var q = db.transaction('kv').objectStore('kv').get(key); q.onsuccess = function () { resolve(q.result); }; q.onerror = function () { reject(q.error); }; }); });
  }
  function idbSet(key, value) {
    return idbOpen().then(function (db) { return new Promise(function (resolve, reject) { var tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(value, key); tx.oncomplete = function () { resolve(); }; tx.onerror = function () { reject(tx.error); }; }); });
  }
  function computeDue(m, today) {   // same rules as the service worker
    var out = [];
    ((m && m.items) || []).forEach(function (it) {
      (it.dates || []).forEach(function (dt) { if (dt <= today && today <= it.expiry) out.push({ key: it.id + '|' + dt, it: it, kind: 'remind' }); });
      if (it.expiry < today && daysBetween(it.expiry, today) <= 30) out.push({ key: it.id + '|exp', it: it, kind: 'expired' });
    });
    return out;
  }
  var mirrorTimer = null;
  function syncMirror() { clearTimeout(mirrorTimer); mirrorTimer = setTimeout(doMirror, 400); }
  function doMirror() {
    if (!window.indexedDB) return;
    var items = activeDocs().filter(function (d) { return d.expiry && !d.progress; }).map(function (d) {
      return { id: d.id, title: d.title, owner: d.owner, expiry: d.expiry, dates: d.leads.map(function (l) { return leadDate(d.expiry, l); }) };
    });
    idbGet('mirror').then(function (old) {
      var shown = (old && old.shown) || {};
      // anything you can see in the app right now counts as already shown
      if (document.visibilityState === 'visible') computeDue({ items: items }, live).forEach(function (x) { shown[x.key] = true; });
      return idbSet('mirror', { lang: lang(), items: items, shown: shown });
    }).catch(function () { /* IndexedDB unavailable: reminders in the app still work */ });
  }
  function setupBackground() {
    if (!state.settings.bg || !('serviceWorker' in navigator)) return;
    navigator.serviceWorker.ready.then(function (reg) {
      if (!('periodicSync' in reg)) return;
      return reg.periodicSync.register('doc-reminders', { minInterval: 12 * 3600 * 1000 });
    }).catch(function () { /* not allowed here */ });
  }
  function bgStatus(node) {
    var set = function (k) { node.textContent = t(k); };
    if (!('serviceWorker' in navigator) || !('PeriodicSyncManager' in window)) { set('bgUnsupported'); return; }
    if (!state.settings.bg) { node.textContent = ''; return; }
    if (!navigator.permissions) { set('bgNeedInstall'); return; }
    navigator.permissions.query({ name: 'periodic-background-sync' }).then(function (p) {
      if (p.state === 'granted') set('bgActive'); else if (p.state === 'denied') set('bgDenied'); else set('bgNeedInstall');
    }).catch(function () { set('bgNeedInstall'); });
  }

  /* ---------- settings ---------- */
  var deferredInstall = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; });
  window.addEventListener('appinstalled', function () { deferredInstall = null; toast(t('installed')); });

  function settingsSheet() {
    var langSeg = segmented('lang', [{ value: 'pl', label: 'Polski' }, { value: 'en', label: 'English' }], lang(), 'two', function (v) {
      state.lang = v; save(); applyLang(); render(); settingsSheet();
    });
    var defPicker = leadPicker(state.settings.leads, function (arr) { state.settings.leads = arr.sort(function (a, b) { return leadDays(b) - leadDays(a); }); save(); });
    var bgI = h('input', { type: 'checkbox', class: 'switch', role: 'switch', checked: state.settings.bg, onchange: function () {
      state.settings.bg = bgI.checked; save(); setupBackground(); bgStatus(bgNote);
    } });
    var bgNote = h('p', { style: 'margin-top:6px' });
    bgStatus(bgNote);
    var notifState = typeof Notification === 'undefined' ? 'none' : Notification.permission;
    var notifNode = notifState === 'granted' ? h('p', null, t('notifAllowed'))
      : notifState === 'denied' ? h('p', null, t('notifBlocked'))
      : notifState === 'none' ? h('p', null, t('notifNone'))
      : button('ghost', t('notifAsk'), function () { Notification.requestPermission().then(function () { settingsSheet(); }); });
    var fileI = h('input', { type: 'file', accept: 'application/json,.json', class: 'vis', tabindex: '-1', 'aria-hidden': 'true',
      onchange: function () { importFile(fileI.files[0]); fileI.value = ''; } });

    openSheet(t('settingsTitle'), null, [
      h('div', { class: 'field' }, h('span', { class: 'lbl' }, t('language')), langSeg),
      h('div', { class: 'section' }, h('h3', null, t('defTitle')), h('p', null, t('defText')), defPicker.node),
      h('div', { class: 'section' }, h('h3', null, t('calTitle')), h('p', null, t('calText')),
        button('primary', t('calBtn'), function () { exportCalendar(state.docs); })),
      h('div', { class: 'section' }, h('h3', null, t('bgTitle')),
        h('label', { class: 'switchrow' }, h('span', null, h('b', null, t('bgToggle')), h('small', null, t('bgHint'))), bgI), bgNote,
        notifNode,
        h('div', { class: 'notice', style: 'margin-top:12px' }, h('b', null, t('limitsTitle')), t('limitsText'))),
      deferredInstall ? h('div', { class: 'section' }, h('h3', null, t('install')), h('p', null, t('installText')),
        button('primary', t('installBtn'), function () { var ev = deferredInstall; deferredInstall = null; closeSheet(); ev.prompt(); })) : null,
      h('div', { class: 'section' }, h('h3', null, t('backup')), h('p', null, t('backupText')),
        h('div', { class: 'btnrow' }, button('ghost', t('saveBackup'), exportData), button('ghost', t('restore'), function () { fileI.click(); }), fileI)),
      h('div', { class: 'section' }, h('h3', null, t('erase')), button('danger', t('eraseBtn'), eraseSheet)),
      h('div', { class: 'btnrow', style: 'margin-top:22px' }, button('ghost', t('close'), closeSheet))
    ]);
  }

  function eraseSheet() {
    openSheet(t('eraseTitle'), t('eraseText'), [
      h('div', { class: 'btnrow' },
        button('danger', t('eraseGo'), function () {
          var keepLang = state.lang; state = blank(); state.lang = keepLang; save(); flt = { owner: '\u0000all', status: '', q: '' }; closeSheet(); render(); toast(t('erased'));
        }),
        button('ghost', t('cancel'), closeSheet))
    ]);
  }

  function exportData() {
    var payload = Object.assign({ app: 'docTracker' }, state);
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = h('a', { href: url, download: 'doc-tracker-backup-' + todayISO() + '.json' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
    toast(t('backupDone'));
  }

  function importFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var data = null;
      try {
        var parsed = JSON.parse(reader.result);
        if (parsed && parsed.app === 'docTracker' && Array.isArray(parsed.docs)) data = sanitize(parsed);
      } catch (e) { data = null; }
      if (!data) { toast(t('badFile')); return; }
      openSheet(t('restoreTitle'), t('restoreText', data.docs.length), [
        h('div', { class: 'btnrow' },
          button('primary', t('restoreGo'), function () {
            state = data; save(); flt = { owner: '\u0000all', status: '', q: '' }; closeSheet(); applyLang(); render(); setupBackground(); toast(t('restored'));
          }),
          button('ghost', t('cancel'), closeSheet))
      ]);
    };
    reader.onerror = function () { toast(t('readFail')); };
    reader.readAsText(file);
  }

  /* ---------- wiring ---------- */
  $('#settingsBtn').innerHTML = ICON.tune;
  $('#calBtn').innerHTML = ICON.cal;
  $('#addBtn').addEventListener('click', function () { docSheet(null); });
  $('#settingsBtn').addEventListener('click', settingsSheet);
  $('#calBtn').addEventListener('click', function () { exportCalendar(state.docs); });

  // A new day changes what is "due" and what has expired.
  function checkNewDay() {
    var now = todayISO();
    if (now === live) return;
    live = now;
    render(); syncMirror();
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { checkNewDay(); syncMirror(); } });
  setInterval(checkNewDay, 60000);

  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  applyLang();
  render();
  syncMirror();
  setupBackground();
})();
</script>
</body>
</html>
